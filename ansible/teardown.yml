---
# teardown.yml - Remove everything deploy.yml created.
#
# By default this removes only the custom resources and leaves the four
# operators installed, which is what you want between demo runs.
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini teardown.yml
#
# To also uninstall the operators (Subscriptions, CSVs, namespaces):
#   ansible-playbook -i inventory/hosts.ini teardown.yml -e uninstall_operators=true
#
# To see what would happen first:
#   ansible-playbook -i inventory/hosts.ini teardown.yml --check

- name: "Teardown OLS + self-hosted LLM deployment"
  hosts: local
  gather_facts: false

  vars:
    uninstall_operators: false

  tasks:
    - name: "Preflight | Verify logged in"
      ansible.builtin.command:
        cmd: oc whoami
      register: oc_whoami
      changed_when: false
      failed_when: oc_whoami.rc != 0
      check_mode: false

    - name: "Confirm teardown"
      ansible.builtin.pause:
        prompt: |
          This will remove:
            - OLSConfig and OLS credentials secret (granite-creds)
            - InferenceService, ServingRuntime, llm-serving namespace
            - RHOAI DataScienceCluster
            - NVIDIA GPU ClusterPolicy (uninstalls driver from the node)
            - NodeFeatureDiscovery CR
          {% if uninstall_operators | bool %}
            - AND the four operators themselves, plus their namespaces:
          {% for op in required_operators %}
                {{ op.name }} ({{ op.namespace }})
          {% endfor %}
          {% else %}

          The operators themselves will NOT be removed.
          {% endif %}

          Press Enter to continue or Ctrl+C to abort.
      when: not ansible_check_mode

    # Reverse of the apply order. --ignore-not-found keeps each step
    # idempotent -- re-running teardown after a partial first run
    # just skips the already-gone resources without erroring.

    - name: "Remove OLSConfig"
      ansible.builtin.command:
        cmd: oc delete olsconfig cluster --ignore-not-found
      register: out
      changed_when: "'deleted' in out.stdout"

    - name: "Remove OLS credentials secret"
      ansible.builtin.command:
        cmd: oc delete secret granite-creds -n openshift-lightspeed --ignore-not-found
      register: out
      changed_when: "'deleted' in out.stdout"

    - name: "Remove InferenceService"
      ansible.builtin.command:
        cmd: oc delete inferenceservice --all -n llm-serving --ignore-not-found
      register: out
      changed_when: "'deleted' in out.stdout"

    - name: "Remove ServingRuntime"
      ansible.builtin.command:
        cmd: oc delete servingruntime --all -n llm-serving --ignore-not-found
      register: out
      changed_when: "'deleted' in out.stdout"

    - name: "Remove llm-serving namespace"
      ansible.builtin.command:
        cmd: oc delete namespace llm-serving --ignore-not-found
      register: out
      changed_when: "'deleted' in out.stdout"

    - name: "Remove DataScienceCluster"
      ansible.builtin.command:
        cmd: oc delete datasciencecluster default-dsc --ignore-not-found
      register: out
      changed_when: "'deleted' in out.stdout"

    - name: "Remove NVIDIA ClusterPolicy"
      ansible.builtin.command:
        cmd: oc delete clusterpolicy gpu-cluster-policy --ignore-not-found
      register: out
      changed_when: "'deleted' in out.stdout"

    - name: "Remove NodeFeatureDiscovery CR"
      ansible.builtin.command:
        cmd: oc delete nodefeaturediscovery nfd-instance -n openshift-nfd --ignore-not-found
      register: out
      changed_when: "'deleted' in out.stdout"


    ############################################################################
    # OPTIONAL: uninstall the operators themselves.
    #
    # Runs in reverse dependency order. The CRs above must be gone first --
    # deleting the GPU Operator while a ClusterPolicy still exists leaves the
    # namespace stuck Terminating on a finalizer.
    ############################################################################

    - name: "Uninstall the operators themselves"
      ansible.builtin.include_tasks: tasks/uninstall-operators.yml
      when: uninstall_operators | bool
      loop: "{{ required_operators | reverse | list }}"
      loop_control:
        loop_var: op
        label: "{{ op.name }}"

    - name: "Uninstall | Note about leftover CRDs"
      ansible.builtin.debug:
        msg:
          - "Operator Subscriptions, CSVs and namespaces removed."
          - "OLM does NOT garbage-collect CRDs. If you want a truly clean"
          - "cluster, delete them by hand:"
          - "  oc delete crd {{ required_operators | map(attribute='crd') | join(' ') }}"
          - "Watch for namespaces stuck Terminating on a finalizer:"
          - "  oc get ns | grep Terminating"
      when: uninstall_operators | bool

    - name: "Teardown summary"
      ansible.builtin.debug:
        msg:
          - "Custom resources removed."
          - >-
            {{ 'Operators were also uninstalled.'
               if uninstall_operators | bool
               else 'Operators themselves were NOT uninstalled.' }}
          - >-
            {{ 'Re-run deploy.yml to reinstall everything from scratch.'
               if uninstall_operators | bool
               else 'Uninstall via OperatorHub > Installed Operators if desired.' }}
