# .github/workflows/build-model-image.yml
#
# Build and push OCI ModelCar images to Quay.io — UBI 10 and Hummingbird variants.
#
# Runs on:
#   - Every Sunday at 6:00 AM UTC (picks up upstream model/base image updates)
#   - Manual dispatch (Actions tab → "Run workflow") with a user-supplied tag
#   - Push to main when Containerfile, hummingbird/Containerfile, or build.sh changes
#
# Required secrets (Settings → Secrets and variables → Actions):
#   HF_TOKEN      — Hugging Face access token (read access to model repo)
#   QUAY_USERNAME — Quay.io robot account name (e.g. ryan_nix+github_actions)
#   QUAY_TOKEN    — Quay.io robot account password
#
# Tags produced per run:
#   UBI 10:        :v1, :latest                         (or :latest only for cron/push)
#   Hummingbird:   :hummingbird-v1, :hummingbird-latest (or :hummingbird-latest only)

name: Build and push model images

on:
  schedule:
    - cron: "0 6 * * 0"    # Every Sunday at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1, v2)"
        required: true
        default: "v1"
      model_id:
        description: "Hugging Face model to build"
        required: true
        default: "ibm-granite/granite-4.1-3b"
        type: choice
        options:
          - "ibm-granite/granite-4.1-3b"
          - "ibm-granite/granite-4.2-3b"
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "hummingbird/Containerfile"
      - "build.sh"

env:
  IMAGE_REPO: quay.io/ryan_nix/granite4-llm
  # Default model for scheduled/push builds. Manual dispatch can override via
  # the model_id input; the step below resolves the effective value.
  DEFAULT_MODEL_ID: ibm-granite/granite-4.1-3b

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker system prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install --upgrade huggingface_hub

      - name: Log in to Hugging Face
        run: |
          python3 -c "
          from huggingface_hub import login
          login(token='${{ secrets.HF_TOKEN }}', add_to_git_credential=False)
          "

      - name: Resolve model ID
        id: model
        run: |
          MID="${{ github.event.inputs.model_id }}"
          if [ -z "${MID}" ]; then
            MID="${DEFAULT_MODEL_ID}"
          fi
          echo "id=${MID}" >> "$GITHUB_OUTPUT"
          echo "Building model: ${MID}"

      - name: Download model weights
        run: |
          mkdir -p model
          python3 -c "
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id='${{ steps.model.outputs.id }}',
              local_dir='model',
              ignore_patterns=['*.gguf', '*.bin', 'original/*'],
          )
          print(f'Downloaded to: {path}')
          "

      - name: Verify model size
        run: |
          echo "=== Model directory ==="
          ls -lh model/
          SIZE=$(du -sb model/ | awk '{print $1}')
          echo "Total size: ${SIZE} bytes"
          MIN=$((3 * 1024 * 1024 * 1024))
          if [ "${SIZE}" -lt "${MIN}" ]; then
            echo "ERROR: Model too small (< 3 GB). Download likely failed."
            exit 1
          fi
          echo "✓ Size check passed."

      - name: Determine image tags
        id: tags
        run: |
          # 4.2 builds get a granite42- prefix on every tag so they never
          # overwrite the proven 4.1 :latest / :hummingbird-latest.
          case "${{ steps.model.outputs.id }}" in
            *granite-4.2-*) PREFIX="granite42-" ;;
            *)              PREFIX="" ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            USER_TAG="${{ github.event.inputs.tag }}"
            echo "ubi_tag=${PREFIX}${USER_TAG}" >> "$GITHUB_OUTPUT"
            echo "hb_tag=${PREFIX}hummingbird-${USER_TAG}" >> "$GITHUB_OUTPUT"
            echo "ubi_latest=${PREFIX}latest" >> "$GITHUB_OUTPUT"
            echo "hb_latest=${PREFIX}hummingbird-latest" >> "$GITHUB_OUTPUT"
          else
            echo "ubi_tag=${PREFIX}latest" >> "$GITHUB_OUTPUT"
            echo "hb_tag=${PREFIX}hummingbird-latest" >> "$GITHUB_OUTPUT"
            echo "ubi_latest=${PREFIX}latest" >> "$GITHUB_OUTPUT"
            echo "hb_latest=${PREFIX}hummingbird-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Quay.io
        run: |
          podman login quay.io \
            -u "${{ secrets.QUAY_USERNAME }}" \
            -p "${{ secrets.QUAY_TOKEN }}"

      # ── UBI 10 variant ──────────────────────────────────────────

      - name: "Build UBI 10 image"
        run: |
          podman build \
            --platform linux/amd64 \
            -t "${IMAGE_REPO}:${{ steps.tags.outputs.ubi_tag }}" \
            -f Containerfile \
            .

      - name: "Push UBI 10 image"
        run: |
          podman push "${IMAGE_REPO}:${{ steps.tags.outputs.ubi_tag }}"
          podman tag "${IMAGE_REPO}:${{ steps.tags.outputs.ubi_tag }}" "${IMAGE_REPO}:${{ steps.tags.outputs.ubi_latest }}"
          podman push "${IMAGE_REPO}:${{ steps.tags.outputs.ubi_latest }}"

      # ── Hummingbird variant ─────────────────────────────────────

      - name: "Build Hummingbird image"
        run: |
          podman build \
            --platform linux/amd64 \
            -t "${IMAGE_REPO}:${{ steps.tags.outputs.hb_tag }}" \
            -f hummingbird/Containerfile \
            .

      - name: "Push Hummingbird image"
        run: |
          podman push "${IMAGE_REPO}:${{ steps.tags.outputs.hb_tag }}"
          podman tag "${IMAGE_REPO}:${{ steps.tags.outputs.hb_tag }}" "${IMAGE_REPO}:${{ steps.tags.outputs.hb_latest }}"
          podman push "${IMAGE_REPO}:${{ steps.tags.outputs.hb_latest }}"

      # ── Summary ─────────────────────────────────────────────────

      - name: Print summary
        run: |
          echo "============================================="
          echo "✓ Both image variants pushed successfully"
          echo ""
          echo "  UBI 10:"
          echo "    ${IMAGE_REPO}:${{ steps.tags.outputs.ubi_tag }}"
          echo "    ${IMAGE_REPO}:${{ steps.tags.outputs.ubi_latest }}"
          echo ""
          echo "  Hummingbird:"
          echo "    ${IMAGE_REPO}:${{ steps.tags.outputs.hb_tag }}"
          echo "    ${IMAGE_REPO}:${{ steps.tags.outputs.hb_latest }}"
          echo ""
          echo "  storageUri (UBI):         oci://${IMAGE_REPO}:${{ steps.tags.outputs.ubi_tag }}"
          echo "  storageUri (Hummingbird): oci://${IMAGE_REPO}:${{ steps.tags.outputs.hb_tag }}"
          echo "============================================="