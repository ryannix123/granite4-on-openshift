---
# InferenceService for IBM Granite 4.1 3B on the 3060 Ti.
#
# storageUri uses the OCI scheme, which makes KServe pull the model
# from a container image (the "ModelCar" pattern). We build this image
# separately -- see Containerfile and build.sh in this bundle.
#
# The RawDeployment annotation matches the DSC setting -- KServe will
# create a plain Deployment + Service instead of a Knative Service.
#
# Resource sizing for 8GB VRAM (3060 Ti):
# - nvidia.com/gpu: 1 -- whole-card allocation
# - memory: 16Gi limit -- vLLM + model loading + headroom
# - cpu: 8 limit -- preprocessing, tokenization
#
# For a real pilot on L4/L40S, change:
# - storageUri to your 26B-A4B image
# - --max-model-len to something larger (32k+)
# - --max-num-seqs to 16 or 32 for real concurrency
# - drop --enforce-eager to let vLLM build CUDA graphs
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-41-3b
  namespace: llm-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: external
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    # A surge rolling update is structurally impossible here: the new pod
    # needs nvidia.com/gpu: 1 while the old pod still holds the only GPU,
    # so it stays Pending forever and the rollout deadlocks. Recreate tears
    # the old pod down first. On a multi-GPU pilot cluster, drop this and
    # take the default rolling update instead.
    deploymentStrategy:
      type: Recreate
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-granite
      # OCI image built from ./Containerfile, pushed to your Quay.
      # Update the tag as you iterate.
      storageUri: oci://quay.io/ryan_nix/granite4-llm:v2-fp8
      resources:
        limits:
          nvidia.com/gpu: "1"
          memory: 16Gi
          cpu: "8"
        requests:
          nvidia.com/gpu: "1"
          memory: 12Gi
          cpu: "4"
